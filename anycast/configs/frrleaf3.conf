interface eth1
 ip address 10.0.3.11/24
interface eth2
 ip address 192.168.99.101/24
!
router bgp 65003
 bgp router-id 10.0.255.13
 neighbor 10.0.3.1 remote-as 64999
 neighbor 192.168.99.2 remote-as 65102
 !
 address-family ipv4 unicast
  maximum-paths 10
  network 192.168.99.0/24
  neighbor 10.0.3.1 route-map ACCEPT-ALL in
  neighbor 10.0.3.1 route-map ACCEPT-ALL out
  neighbor 192.168.99.2 route-map ACCEPT-ALL in
  neighbor 192.168.99.2 route-map ACCEPT-ALL out
 exit-address-family
!
route-map ACCEPT-ALL permit 10
